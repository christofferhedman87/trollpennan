*{box-sizing:border-box}html,body{margin:0;width:375px;height:812px;overflow:hidden;font-family:Fredoka,sans-serif;color:var(--ink)}

.sq{width:48px;height:48px;border-radius:14px;background:var(--cream);display:grid;place-items:center;box-shadow:0 4px 0 var(--deep);font-size:22px}

.sp{flex:1}

.under{font-size:20px;font-weight:600;text-align:center}
/* tangentbord */
.tb{background:#efe1c2;padding:8px 4px 10px;border-radius:16px 16px 0 0;display:grid;gap:7px}
.rad{display:flex;gap:3px;justify-content:center}
.k{width:30px;height:46px;border-radius:8px;background:#fffaf0;box-shadow:0 2px 0 #cdb88d;display:grid;place-items:center;font-size:20px;font-weight:600}
.k.dim{opacity:.55}.k.nasta{background:var(--gold);box-shadow:0 0 0 4px #fff3,0 0 18px 6px #f2b632cc;transform:scale(1.12);font-weight:700}
.k.bred{width:52px}.k.mell{width:220px;font-size:16px}

.rutor{display:flex;gap:8px;justify-content:center}
.ruta{width:56px;height:66px;border-radius:12px;background:#fff;border:3px solid var(--deep);display:grid;place-items:center;font-size:38px;font-weight:700}
.ruta.klar{border-color:var(--moss);color:var(--mossd)}.ruta.nu{border-color:var(--gold);box-shadow:0 0 0 4px #f2b63255}
.etikett{display:none;position:absolute;left:0;right:0;bottom:0;padding:4px 8px;background:#000a;color:#fff;font:600 12px Fredoka;text-align:center;z-index:50}
